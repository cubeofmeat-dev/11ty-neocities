<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} - CubeOfMeat Official Fan Site</title>
    <link rel="icon" type="image/x-icon" href="/resources/cubeofmeat.png" />
    <link rel="stylesheet" href="https://unpkg.com/xp.css" />
    <link
      rel="stylesheet"
      href="/styles/style.css"
      type="text/css"
      media="all"
    />
  </head>

  <body>
    <div id="main-window" class="window">
      <div class="title-bar">
        <div class="title-bar-text">CubeOfMeat Official Fan Site</div>
        <div class="title-bar-controls">
          <button
            id="main-minimize"
            aria-label="Minimize"
            onclick="handleMinimize(this.id)"
          ></button>
          <button
            id="main-Restore"
            aria-label="Restore"
            onclick="handleRestore(this.id)"
          ></button>
          <button
            id="main-close"
            aria-label="Close"
            onclick="handleClose(this.id)"
          ></button>
        </div>
      </div>
      <div id="main-body" class="window-body">
        <article id="main-article" role="tabpanel">
          <div id="main-article-content">
            <a href="/index.html">Go Back</a>
            <table>
              {% gamereviews %}{{ content }}{% endgamereviews %}
            </table>
          </div>
        </article>
        <div class="status-bar">
          <div class="status-bar-field"><a href="/">CubeOfMeat Home</a></div>
          <div class="status-bar-field">
            <a href="https://cubeofmeat.atabook.org/">Guest Book</a>
          </div>
          <div class="status-bar-field">
            <a href="https://github.com/cubeofmeat-dev/cubeofmeat.neocities.org"
              >GitHub</a
            >
          </div>
        </div>
      </div>
    </div>
    <script type="text/javascript" src="/scripts/script.js"></script>
  </body>
</html>
