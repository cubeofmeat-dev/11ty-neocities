<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/images/cubeofmeat-favicon-gaming.png" />
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/snes.css@1.0.1/dist/snes.min.css" />
  <link rel="stylesheet" type="text/css" href="/index.css" />
  <title>{{ title }}</title>
</head>

<body class="main-container">
  {{ content }}
  <footer id="site-footer">
    <span>© CubeOfMeat · Built with 11ty · Hosted on Neocities</span>
    <a id="font-toggle" href="#" onclick="toggleFont(); return false;">Easy Font</a>
  </footer>
  <script>
    (function() {
      if (localStorage.getItem('easyFont')) {
        document.body.classList.add('easy-font');
        document.getElementById('font-toggle').textContent = 'Retro Font';
      }
    })();
    function toggleFont() {
      const isEasy = document.body.classList.toggle('easy-font');
      document.getElementById('font-toggle').textContent = isEasy ? 'Retro Font' : 'Easy Font';
      isEasy ? localStorage.setItem('easyFont', '1') : localStorage.removeItem('easyFont');
    }
  </script>
</body>

</html>
