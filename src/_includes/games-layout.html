<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/xp.css" />
    <title>{{ title }}</title>
    <style>
      body {
        padding: 20px;
        background: teal;
      }
      h1 {
        color: white;
        text-shadow: 1px 1px 2px black;
        margin-bottom: 20px;
      }
      .window {
        margin-bottom: 20px;
        max-width: 800px;
      }
      .window-body p {
        margin: 0 0 1em 0;
      }
      .window-body p:last-child {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    {% xpwindows %}{{ content }}{% endxpwindows %}
  </body>
</html>
